# 2026-10-03: 2025 과세연도 장기 양도소득세 3구간 (0%/15%/20%).
# 구간 상한은 일반소득과 양도소득을 합한 과세표준 기준이며, 양도소득은
# 일반소득 위에 쌓인다(IRC 1(h)(1)).
# Net Investment Income Tax (IRC § 1411)은 고정 임계치(인플레이션 미연동).
