# 2026-10-03: New York 2025 개인소득세 누진 9구간.
# MFJ/QSS, Single/MFS, HoH 세 스케줄. 스케줄 세액은 공시 표의 정수 달러
# 기준액(base)에 해당 구간 세율 x 하한 초과액을 더한다. NYAGI 가 107,650 을 넘으면
# recapture 항목의 세액 계산 워크시트 규칙을 적용한다.
# recapture.worksheets.<status>.first: 과세표준이 taxable_upper 이하일 때
#   NYAGI 가 agi_threshold + phase_in_width 이상이면 과세표준 x rate,
#   그 미만이면 스케줄 세액에 (rate 세액 - 스케줄 세액) x 비율을 더한다.
# recapture.worksheets.<status>.steps: 과세표준이 taxable_over 를 넘는 마지막
#   단계에서 스케줄 세액 + recapture_base + incremental_benefit x 비율.
#   비율 = min(NYAGI - taxable_over, phase_in_width) / phase_in_width (소수 넷째 자리).
