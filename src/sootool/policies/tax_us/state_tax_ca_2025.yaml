# 2026-10-03: California 2025 주소득세 누진구간 (Schedules X, Y, Z).
# brackets 는 FTB 세율 스케줄 9구간을 그대로 옮긴 것이며 base 는 표에 인쇄된
# 해당 구간 기준액이다. 세액 = base + rate x (과세표준 - 하한).
# surcharge 는 Behavioral Health Services Tax: 신고 유형과 무관하게 과세표준
# 1,000,000 초과분에 1% 를 더한다.
# MFJ/QSS 구간 상한 = single 상한의 2배. HoH 는 별도 스케줄.
