sha256: "35a787f4153bf50bb24d534d0354407f257dc364c39236df1cb2cb8c22f5bd1b"
effective_date: "2026-01-01"
status: enacted
notice_no: "법인세법 제55조제1항 (법률 제21217호, 2025-12-23 공포, 2026-01-01 이후 개시 사업연도) / 조세특례제한법 제132조제1항"
source_url: "https://www.law.go.kr/법령/법인세법/제55조"
citations:
  - law: "법인세법"
    article: "제55조제1항제1호"
    url: "https://www.law.go.kr/법령/법인세법/제55조"
    note: "2억 이하 10%, 200억 이하 20%, 3천억 이하 22%, 초과 25%. 법률 제21217호 2026-01-01 시행"
  - law: "법인세법"
    article: "부칙(법률 제21217호) 제5조"
    url: "https://www.law.go.kr/DRF/lawService.do?OC=test&target=law&MST=280349&type=XML"
    note: "제55조제1항 개정규정은 2026-01-01 이후 개시하는 사업연도 소득분부터 적용"
  - law: "법인세법"
    article: "제55조제1항제2호, 제60조의2제1항제1호"
    url: "https://www.law.go.kr/법령/법인세법/제60조의2"
    note: "성실신고확인대상 소규모 법인: 200억 이하 20%, 3천억 이하 22%, 초과 25%. 법률 제21217호 2026-01-01 시행"
  - law: "조세특례제한법"
    article: "제132조제1항"
    url: "https://www.law.go.kr/법령/조세특례제한법/제132조"
    note: "최저한세: 감면 후 세액이 감면 전 과세표준 x (중소 7%, 졸업 후 3년 8%·다음 2년 9%, 일반 100억 이하 10%·1천억 이하 12%·초과 17%)에 미달하면 미달분 감면 배제. 개정 2025-12-23 반영본(2026-09-18 시행) 현행"
data:
  # 법인세 누진세율 (법인세법 제55조제1항제1호)
  # 2억 이하 10%, 2억 초과~200억 이하 20%, 200억 초과~3000억 이하 22%, 3000억 초과 25%
  brackets:
    - upper: 200000000
      rate: 0.10
    - upper: 20000000000
      rate: 0.20
    - upper: 300000000000
      rate: 0.22
    - upper: null
      rate: 0.25
  # 제60조의2제1항제1호 해당 법인 (법인세법 제55조제1항제2호)
  small_rental_brackets:
    - upper: 20000000000
      rate: 0.20
    - upper: 300000000000
      rate: 0.22
    - upper: null
      rate: 0.25
  # 최저한세율 (조세특례제한법 제132조제1항)
  minimum_tax:
    small:      "0.07"
    general:    "0.10"
    # 일반 법인: 100억 이하 10%, 100억 초과~1000억 이하 12%, 1000억 초과 17%
    general_brackets:
      - upper: 10000000000
        rate: 0.10
      - upper: 100000000000
        rate: 0.12
      - upper: null
        rate: 0.17
    # 최초로 중소기업에 해당하지 않게 된 과세연도 개시일부터 3년 이내 8%, 그다음 2년 이내 9%
    sme_graduation:
      first_3y: "0.08"
      next_2y:  "0.09"
