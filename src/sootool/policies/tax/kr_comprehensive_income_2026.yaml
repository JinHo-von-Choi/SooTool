meta:
  domain: tax
  name:   kr_comprehensive_income
  year:   2026
effective_date: "2026-01-01"
status: enacted
notice_no: "소득세법 제14조제3항제6호·제8호가목, 제14조제4항, 제17조제3항, 제51조, 제56조, 제59조의2, 제59조의4제9항, 제62조, 제129조제1항제1호라목·제2호나목·제6호라목 (법률 제21548호, 2026-04-21 시행본 기준) / 같은 법 시행령 제87조제1호의2, 제116조의2, 제119조의3제1항 (대통령령 제36737호, 2026-10-01 시행본 기준)"
source_url: "https://www.law.go.kr/법령/소득세법"
citations:
  - law: "소득세법"
    article: "제14조제3항제6호, 제14조제4항"
    url: "https://www.law.go.kr/법령/소득세법/제14조"
    note: "원천징수된 이자소득과 배당소득(출자공동사업자 배당 제외)의 합계액이 2천만원(이자소득등의 종합과세기준금액) 이하이면 종합소득과세표준에 합산하지 않는다. 기준금액 계산 시 배당가산액은 포함하지 않는다"
  - law: "소득세법"
    article: "제17조제3항"
    url: "https://www.law.go.kr/법령/소득세법/제17조"
    note: "법인세가 과세된 내국법인 배당 등(같은 항 각 호 제외)은 총수입금액에 그 배당소득의 100분의 10을 더한 금액을 배당소득금액으로 한다(2023.12.31. 개정, 2024.12.31. 개정)"
  - law: "소득세법"
    article: "제56조제1항·제4항"
    url: "https://www.law.go.kr/법령/소득세법/제56조"
    note: "배당세액공제는 배당가산액 상당액을 종합소득 산출세액에서 공제한다. 대상 배당소득금액은 종합과세기준금액을 초과하는 것"
  - law: "소득세법 시행령"
    article: "제116조의2"
    url: "https://www.law.go.kr/법령/소득세법시행령/제116조의2"
    note: "종합과세기준금액 초과 배당소득금액은 이자소득부터, 배당 중에서는 배당가산 대상이 아닌 배당부터 먼저 합산해 계산한다"
  - law: "조세심판원 결정"
    article: "국심2007중1921 (2007.7.31.)"
    url: "https://casenote.kr/조세심판원/국심2007중1921"
    note: "배당가산액은 배당가산 대상 배당소득 총수입금액 중 종합과세기준금액을 초과하는 금액에 배당가산율을 적용해 산출하고, 배당세액공제는 배당가산액과 두 산출세액 차액 중 작은 금액"
  - law: "소득세법"
    article: "제15조제2호, 제62조"
    url: "https://www.law.go.kr/법령/소득세법/제62조"
    note: "이자소득등이 종합과세기준금액을 초과하면 산출세액은 (기준금액 초과분과 다른 종합소득금액에 대한 기본세율 세액 + 기준금액 x 100분의 14)와 (이자소득등 x 원천징수세율 + 다른 종합소득금액에 대한 기본세율 세액) 중 큰 금액. 배당세액공제 후 세액은 제62조제2호 금액보다 작을 수 없다(제15조제2호)"
  - law: "소득세법"
    article: "제129조제1항제1호라목, 제2호나목, 제6호라목"
    url: "https://www.law.go.kr/법령/소득세법/제129조"
    note: "그 밖의 이자소득과 그 밖의 배당소득 원천징수세율 100분의 14. 그 밖의 기타소득 원천징수세율 100분의 20"
  - law: "소득세법"
    article: "제14조제3항제8호가목"
    url: "https://www.law.go.kr/법령/소득세법/제14조"
    note: "제21조제1항제1호부터 제20호까지 등의 기타소득으로 기타소득금액이 300만원 이하이면서 원천징수된 소득은 분리과세. 거주자가 합산을 선택하면 종합과세"
  - law: "소득세법 시행령"
    article: "제87조제1호의2"
    url: "https://www.law.go.kr/법령/소득세법시행령/제87조"
    note: "법 제21조제1항제7호·제8호의2·제9호·제15호·제19호의 기타소득은 받은 금액의 100분의 60을 필요경비로 하고, 실제 필요경비가 더 크면 그 초과액도 산입한다(대통령령 제36737호 2026.10.1. 시행본)"
  - law: "소득세법"
    article: "제51조제1항·제4항"
    url: "https://www.law.go.kr/법령/소득세법/제51조"
    note: "추가공제: 70세 이상 1명당 100만원, 장애인 1명당 200만원, 부녀자(종합소득금액 3천만원 이하) 50만원, 한부모 100만원. 부녀자와 한부모에 모두 해당하면 한부모만. 인적공제 합계가 종합소득금액을 넘으면 넘는 부분은 없는 것으로 한다"
  - law: "소득세법"
    article: "제59조의2제1항·제3항"
    url: "https://www.law.go.kr/법령/소득세법/제59조의2"
    note: "자녀세액공제 1명 25만원, 2명 55만원, 3명 이상 55만원 + 2명 초과 1명당 40만원. 출산·입양 첫째 30만원, 둘째 50만원, 셋째 이상 70만원"
  - law: "소득세법"
    article: "부칙(법률 제21548호, 2026.4.21.) 제1조, 제2조"
    url: "https://www.law.go.kr/법령/소득세법/(21548,20260421)"
    note: "제59조의2제1항 연령기준 개정(13세 이상)은 시행일이 속하는 과세기간분부터 적용하되 2026년 과세기간분은 9세 이상, 2027년 10세, 2028년 11세, 2029년 12세 이상. 2017년 출생 자녀와 손자녀는 이 경과 연령기준을 적용하지 않는다"
  - law: "소득세법"
    article: "제59조의4제9항"
    url: "https://www.law.go.kr/법령/소득세법/제59조의4"
    note: "표준세액공제: 근로소득자로서 특별소득공제·특별세액공제·월세세액공제를 신청하지 않으면 13만원. 근로소득이 없는 종합소득자로서 조세특례제한법 제122조의3 세액공제를 신청하지 않으면 성실사업자 12만원, 그 밖에는 7만원"
  - law: "소득세법 시행령"
    article: "제119조의3제1항"
    url: "https://www.law.go.kr/법령/소득세법시행령/제119조의3"
    note: "근로소득에 대한 종합소득산출세액은 종합소득산출세액에 근로소득금액이 종합소득금액에서 차지하는 비율을 곱한 금액"
data:
  # 이자소득등의 종합과세기준금액 (제14조제3항제6호). 이하이면 분리과세
  financial_income_threshold: 20000000
  # 그 밖의 이자소득·배당소득 원천징수세율 (제129조제1항제1호라목, 제2호나목)
  financial_withholding_rate: "0.14"
  # 배당가산율 (제17조제3항 각 호 외의 부분 단서)
  dividend_gross_up_rate: "0.10"
  # 기타소득 의제필요경비율 (시행령 제87조제1호의2)
  other_income_deemed_expense_rate: "0.60"
  # 분리과세기타소득 선택 기준 기타소득금액 (제14조제3항제8호가목). 이하이면 분리과세
  other_income_separate_threshold: 3000000
  # 그 밖의 기타소득 원천징수세율 (제129조제1항제6호라목)
  other_income_withholding_rate: "0.20"
  # 추가공제 (제51조제1항)
  additional_deduction:
    elderly:             1000000
    disabled:            2000000
    woman:               500000
    woman_income_limit:  30000000
    single_parent:       1000000
  # 자녀세액공제 (제59조의2제1항·제3항, 부칙 법률 제21548호 제2조제2항제1호)
  child_tax_credit:
    age_min:             9
    one:                 250000
    two:                 550000
    per_child_over_two:  400000
    birth_first:         300000
    birth_second:        500000
    birth_third_or_later: 700000
  # 근로소득이 없는 종합소득자의 표준세액공제 (제59조의4제9항제2호)
  standard_tax_credit_non_wage:
    diligent_business:   120000
    other:               70000
