sha256: "743e8549ddb6a844aa5f51d714619f0ca3e5096e124672fce734cedb0b9481e4"
effective_date: "2026-01-01"
status: enacted
notice_no: "상속세 및 증여세법 제18조·제19조·제20조·제21조·제24조·제26조·제69조 (법률 제21219호, 2025-12-23 공포, 2026-01-01 시행 기준)"
source_url: "https://www.law.go.kr/법령/상속세및증여세법"
citations:
  - law: "상속세 및 증여세법"
    article: "제27조"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제27조"
    note: "세대를 건너뛴 상속에 대한 할증과세: 상속인이 피상속인의 자녀를 제외한 직계비속이면 산출세액 x 그 상속인이 받은 재산의 비율 x 30%, 미성년자가 받은 재산이 20억원 초과면 40%"
  - law: "상속세 및 증여세법"
    article: "제18조"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제18조"
    note: "기초공제 2억. 2026-01-01 시행본 현행"
  - law: "상속세 및 증여세법"
    article: "제19조"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제19조"
    note: "배우자공제: 실제 상속액, 한도 min(법정상속분 한도금액, 30억). 실제 상속액이 없거나 5억 미만이면 5억. 2026-01-01 시행본 현행"
  - law: "상속세 및 증여세법"
    article: "제20조제1항"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제20조"
    note: "자녀 1명당 5천만, 미성년자 1천만 x 19세까지 연수, 65세 이상 5천만, 장애인 1천만 x 기대여명 연수. 개정 2025-10-01, 2026-01-01 시행본 현행"
  - law: "상속세 및 증여세법"
    article: "제21조"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제21조"
    note: "일괄공제: max(기초공제 + 제20조 인적공제, 5억). 배우자 단독상속이면 기초 + 인적공제만. 2026-01-01 시행본 현행"
  - law: "상속세 및 증여세법"
    article: "제24조"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제24조"
    note: "상속공제 한도: 과세가액 - 상속인 아닌 자 유증등 - 상속포기분 - 가산한 사전증여재산(과세가액 5억 초과 시). 2026-01-01 시행본 현행"
  - law: "상속세 및 증여세법"
    article: "제26조"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제26조"
    note: "세율 10/20/30/40/50%, 구간 1억/5억/10억/30억. 2026-01-01 시행본 현행"
  - law: "상속세 및 증여세법"
    article: "제69조제1항"
    url: "https://www.law.go.kr/법령/상속세및증여세법/제69조"
    note: "신고세액공제: (산출세액 - 징수유예액 - 공제감면액) x 3%. 2026-01-01 시행본 현행"
data:
  # 상속세 누진세율 (상속세 및 증여세법 제26조)
  brackets:
    - upper: 100000000
      rate: 0.10
    - upper: 500000000
      rate: 0.20
    - upper: 1000000000
      rate: 0.30
    - upper: 3000000000
      rate: 0.40
    - upper: null
      rate: 0.50
  # 상속공제 (제18조·제19조·제20조·제21조)
  deductions:
    lump_sum: 500000000          # 일괄공제 5억 (제21조)
    spouse_min: 500000000        # 배우자 최소공제 5억 (제19조제4항)
    spouse_max: 3000000000       # 배우자 공제 한도 30억 (제19조제1항제2호)
    basic: 200000000             # 기초공제 2억 (제18조)
    # 그 밖의 인적공제 (제20조제1항)
    personal:
      child_each: 50000000              # 자녀(태아 포함) 1명당 5천만
      minor_per_year: 10000000          # 미성년자 1천만 x 19세까지 연수
      elderly_each: 50000000            # 65세 이상 1명당 5천만
      disabled_per_life_year: 10000000  # 장애인 1천만 x 기대여명 연수
  # 공제 종합한도 중 사전증여재산 차감 기준 (제24조 단서)
  pre_gift_limit_threshold: 500000000
  # 세대생략 할증 (제27조): 산출세액 x (세대를 건너뛴 상속인이 받은 재산 / 상속세 과세가액) x 30%,
  # 미성년자가 받은 재산이 20억원을 넘으면 40%. 민법 제1001조 대습상속에는 적용하지 않는다.
  generation_skip_surcharge:
    rate: "0.30"
    minor_large_estate_rate: "0.40"
    minor_large_estate_threshold: 2000000000
  # 신고세액공제율 (제69조제1항)
  filing_credit_rate: "0.03"
