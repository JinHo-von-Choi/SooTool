meta:
  domain: tax
  name:   kr_pension_income
  year:   2026
effective_date: "2026-01-01"
status: enacted
notice_no: "소득세법 제14조제3항제8호·제9호, 제20조의3, 제47조의2, 제64조의4, 제129조제1항제5호의2·제5호의3·제6호나목 (법률 제21221호, 2025-12-23 개정, 2026-07-01 시행본 기준) / 같은 법 시행령 제40조의2제3항, 제187조의2, 제187조의3 / 지방세법 제103조의13제1항"
source_url: "https://www.law.go.kr/법령/소득세법"
citations:
  - law: "소득세법"
    article: "제129조제1항제5호의2"
    url: "https://www.law.go.kr/법령/소득세법/제129조"
    note: "연금계좌 세액공제분·운용수익 연금수령 원천징수세율: 연금수령일 현재 70세 미만 100분의 5, 70세 이상 80세 미만 100분의 4, 80세 이상 100분의 3. 종신계약 100분의 3. 요건을 동시에 충족하면 낮은 세율"
  - law: "소득세법"
    article: "제129조제1항제5호의3"
    url: "https://www.law.go.kr/법령/소득세법/제129조"
    note: "이연퇴직소득 연금수령 원천징수세율: 연금 실제 수령연차 10년 이하 연금외수령 원천징수세율의 100분의 70, 10년 초과 20년 이하 100분의 60, 20년 초과 100분의 50"
  - law: "소득세법"
    article: "제129조제1항제6호나목"
    url: "https://www.law.go.kr/법령/소득세법/제129조"
    note: "제21조제1항제21호 연금외수령 기타소득 원천징수세율 100분의 15"
  - law: "소득세법"
    article: "제14조제3항제8호나목, 제9호"
    url: "https://www.law.go.kr/법령/소득세법/제14조"
    note: "연금외수령 기타소득은 분리과세기타소득. 이연퇴직소득 연금수령분, 의료목적 등 부득이한 인출분, 그 밖의 사적연금 합계 연 1천500만원 이하분은 분리과세연금소득"
  - law: "소득세법"
    article: "부칙 <법률 제19196호, 2022-12-31> 제1조, 제13조"
    url: "https://www.law.go.kr/법령/소득세법/(19196,20221231)"
    note: "분리과세 기준금액 1천200만원에서 1천500만원으로 상향, 2023-01-01 시행. 시행 전 지급 연금소득은 종전 규정"
  - law: "소득세법"
    article: "제64조의4"
    url: "https://www.law.go.kr/법령/소득세법/제64조의4"
    note: "분리과세연금소득 외 사적연금소득이 있으면 종합소득 결정세액과, 그 연금소득 x 100분의 15 + 나머지 종합소득 결정세액 중 선택"
  - law: "소득세법"
    article: "제47조의2"
    url: "https://www.law.go.kr/법령/소득세법/제47조의2"
    note: "연금소득공제: 350만원 이하 전액, 700만원 이하 350만원+초과분 40%, 1천400만원 이하 490만원+초과분 20%, 초과 630만원+초과분 10%, 한도 900만원. 총연금액에서 분리과세연금소득 제외"
  - law: "소득세법 시행령"
    article: "제40조의2제3항"
    url: "https://www.law.go.kr/법령/소득세법시행령/제40조의2"
    note: "연금수령 요건: 55세 이후 개시 신청, 가입 5년 경과(이연퇴직소득 있으면 제외), 연금수령한도 이내. 한도 초과 인출은 연금외수령(제5항)"
  - law: "소득세법 시행령"
    article: "제187조의2, 제187조의3"
    url: "https://www.law.go.kr/법령/소득세법시행령/제187조의3"
    note: "종신계약은 사망일까지 연금수령하면서 중도 해지할 수 없는 계약. 연금외수령 원천징수세율은 연금외수령 가정 원천징수세액(제202조의2제2항부터 제4항)을 연금외수령 금액으로 나눈 비율. 시행령 2026-10-01 시행본 기준"
  - law: "지방세법"
    article: "제103조의13제1항"
    url: "https://www.law.go.kr/법령/지방세법/제103조의13"
    note: "원천징수하는 소득세의 100분의 10을 개인지방소득세로 특별징수"
data:
  # 연금계좌 세액공제분·운용수익 연금수령 (소득세법 제129조제1항제5호의2가목). min_age 이상 max_age 미만
  private_pension_age_rates:
    - {min_age: 0,  max_age: 70,   rate: "0.05"}
    - {min_age: 70, max_age: 80,   rate: "0.04"}
    - {min_age: 80, max_age: null, rate: "0.03"}
  # 종신계약 (같은 호 다목, 시행령 제187조의2)
  lifetime_annuity_rate: "0.03"
  # 이연퇴직소득 연금수령: 연금외수령 원천징수세율에 곱하는 비율 (같은 항 제5호의3). max_years 이하
  deferred_retirement_ratios:
    - {max_years: 10,   ratio: "0.70"}
    - {max_years: 20,   ratio: "0.60"}
    - {max_years: null, ratio: "0.50"}
  # 연금외수령 기타소득 (제21조제1항제21호, 제129조제1항제6호나목)
  non_pension_withdrawal_rate: "0.15"
  # 개인지방소득세 특별징수 (지방세법 제103조의13제1항)
  local_income_tax_ratio: "0.10"
  # 사적연금 분리과세 기준금액 (제14조제3항제9호다목, 이하이면 분리과세)
  separate_taxation_threshold: 15000000
  # 분리과세 외 사적연금 세액 계산 특례 세율 (제64조의4제2호가목)
  separate_taxation_option_rate: "0.15"
  # 연금수령 개시 최저 나이 (시행령 제40조의2제3항제1호)
  pension_receipt_min_age: 55
  # 연금소득공제 (제47조의2제1항). over 초과 구간: base + (총연금액 - over) x rate
  pension_income_deduction:
    brackets:
      - {over: 0,        upto: 3500000,  base: 0,       rate: "1.00"}
      - {over: 3500000,  upto: 7000000,  base: 3500000, rate: "0.40"}
      - {over: 7000000,  upto: 14000000, base: 4900000, rate: "0.20"}
      - {over: 14000000, upto: null,     base: 6300000, rate: "0.10"}
    cap: 9000000
