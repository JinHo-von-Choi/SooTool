sha256: "c8c87ef671fa83184b849acdd7fe74677ab9156eb9f9074c1174caa2106201dd"
meta:
  domain: tax
  name:   kr_simplified_vat
  year:   2027
effective_date: "2027-01-01"
status: proposed
notice_no: "2026년 세제개편안 부가가치세법 제46조 개정안 (재정경제부 2026-08-03 발표, 2026-09-01 국무회의 의결, 2027-01-01 이후 공급분) / 그 밖의 값은 현행 부가가치세법 제61조·제63조·제69조, 같은 법 시행령 제109조제1항·제111조제2항"
source_url: "https://mofe.go.kr/nw/nes/detailNesDtaView.do?searchBbsId1=MOSFBBS_000000000028&searchNttId1=MOSF_000000000078809&menuNo=4010100"
citations:
  - law: "부가가치세법"
    article: "제61조제1항"
    url: "https://www.law.go.kr/법령/부가가치세법/제61조"
    note: "직전 연도 공급대가 기준 간이과세 적용 범위. 부동산임대업·과세유흥장소는 해당 업종 직전 연도 공급대가 4,800만원 이상이면 배제(제3호). 2026-01-01 시행본 현행"
  - law: "부가가치세법 시행령"
    article: "제109조제1항"
    url: "https://www.law.go.kr/법령/부가가치세법시행령/제109조"
    note: "간이과세 기준금액 1억4백만원. 개정 2024-02-29, 2026-02-27 개정 시행령에서도 같음"
  - law: "부가가치세법"
    article: "제63조"
    url: "https://www.law.go.kr/법령/부가가치세법/제63조"
    note: "납부세액 = 공급대가 x 업종별 부가가치율 x 10%(제2항). 세금계산서등 수취 공급대가 x 0.5% 공제(제3항제1호, 2021-07-01 이후 공급분). 공제 합계가 납부세액을 넘으면 초과분 없음(제6항)"
  - law: "부가가치세법 시행령"
    article: "제111조제2항"
    url: "https://www.law.go.kr/법령/부가가치세법시행령/제111조"
    note: "업종별 부가가치율 15/20/25/30/40/30%. 개정 2021-02-17"
  - law: "부가가치세법"
    article: "제69조제1항"
    url: "https://www.law.go.kr/법령/부가가치세법/제69조"
    note: "해당 과세기간 공급대가 4,800만원 미만 납부의무 면제"
  - law: "부가가치세법 개정안(2026년 세제개편안)"
    article: "제46조제1항제3호"
    url: "https://mofe.go.kr/com/cmm/fms/FileDown.do?atchFileId=ATCH_000000000032335&fileSn=6"
    note: "한시 우대공제 공제율 1.3%에서 1.2%, 한도 연 1천만원에서 500만원, 적용기한 2029-12-31까지 연장. 2027-01-01 이후 공급분부터. 국회 의결 전"
  - law: "부가가치세법"
    article: "제46조제1항제3호"
    url: "https://www.law.go.kr/법령/부가가치세법/제46조"
    note: "현행 본칙: 2027-01-01 이후 발급금액 x 1%, 연간 500만원 한도. 개정안이 의결되지 않으면 본칙이 적용됨"
data:
  # 간이과세 기준 (직전 연도 공급대가 기준, 시행령 제109조제1항)
  threshold_amount: 104000000       # 1억4백만원 미만이어야 간이과세 대상
  # 부동산임대업·과세유흥장소 간이과세 배제 기준 (법 제61조제1항제3호)
  restricted_threshold_amount: 48000000
  nonpayment_threshold: 48000000    # 해당 과세기간 공급대가 4,800만원 미만이면 납부 면제 (법 제69조제1항)
  vat_rate: "0.10"                  # 부가가치세율 10% (법 제63조제2항)
  # 세금계산서등 수취 공급대가 공제율 (법 제63조제3항제1호)
  input_credit_rate: "0.005"
  # 신용카드 등 매출세액공제 (법 제46조제1항제3호 개정안, 2027-01-01 이후 공급분)
  card_sales_credit:
    rate: "0.012"
    annual_limit: 5000000

  # 업종별 부가가치율 (시행령 제111조제2항 표)
  value_added_rates:
    retail:              "0.15"   # 소매업, 재생용 재료수집 및 판매업, 음식점업
    manufacturing:       "0.20"   # 제조업, 농업·임업 및 어업, 소화물 전문 운송업
    accommodation:       "0.25"   # 숙박업
    construction:        "0.30"   # 건설업, 운수 및 창고업(소화물 전문 운송업 제외), 정보통신업
    financial:           "0.40"   # 금융·보험 관련 서비스업, 전문·과학·기술서비스업(인물사진·행사용 영상 촬영업 제외), 사업시설관리·사업지원·임대서비스업, 부동산 관련 서비스업, 부동산임대업
    other_services:      "0.30"   # 그 밖의 서비스업
    # 별칭
    sales:               "0.15"   # 판매업 (=retail)
    food_service:        "0.15"   # 음식점업 (표 제1호)
    real_estate_rental:  "0.40"   # 부동산임대업 (표 제5호)
    transport_warehousing:     "0.30"   # 운수 및 창고업(소화물 전문 운송업 제외) (표 제4호)
    information_communication: "0.30"   # 정보통신업 (표 제4호)
