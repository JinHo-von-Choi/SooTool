  name:   kr_eitc
  year:   2026
effective_date: "2026-01-01"
status: enacted
notice_no: "조세특례제한법 제100조의3·제100조의5·제100조의7 (법률 제20617호 2024.12.31. 개정, 2025.1.1. 이후 신청분부터, 부칙 제17조) / 같은 법 시행령 제100조의3·제100조의6, 별표 11 (대통령령 제35347호 2025.2.28. 개정, 2025.1.1. 이후 신청분부터, 부칙 제14조제2항). 법률 제21467호(2026.9.18. 시행) 현행본과 같다"
source_url: "https://www.law.go.kr/법령/조세특례제한법/제100조의5"
citations:
  - law: "조세특례제한법"
    article: "제100조의3제1항제2호·제4호, 제5항"
    url: "https://www.law.go.kr/법령/조세특례제한법/제100조의3"
    note: "총소득기준금액 단독 2,200만원, 홑벌이 3,200만원, 맞벌이 4,400만원 미만. 가구원 재산 합계액 2억4천만원 미만. 홑벌이는 배우자 총급여액 등 3백만원 미만 또는 배우자 없이 부양자녀나 70세 이상 직계존속이 있는 가구, 맞벌이는 부부 각각 총급여액 등 3백만원 이상. 총급여액 등은 사업소득(시행령 조정률 적용), 근로소득, 종교인소득의 합계(비과세와 시행령 제외 소득 제외)"
  - law: "조세특례제한법"
    article: "제100조의5제1항·제3항·제4항·제5항"
    url: "https://www.law.go.kr/법령/조세특례제한법/제100조의5"
    note: "단독 400만/900만/2,200만원(최대 165만원), 홑벌이 700만/1,400만/3,200만원(최대 285만원), 맞벌이 800만/1,700만/4,400만원(최대 330만원, 점감 2천700분의 330). 배우자 총급여액 등 합산(제3항). 재산 합계액 1억7천만원 이상이면 100분의 50(제4항). 금액은 시행령 근로장려금산정표로 산정(제5항)"
  - law: "조세특례제한법"
    article: "제100조의7제2항·제3항"
    url: "https://www.law.go.kr/법령/조세특례제한법/제100조의7"
    note: "기한 후 신청(제100조의6제8항)은 산정액의 100분의 95. 산정액 1만5천원 미만은 없는 것으로, 점증구간(각 호 가목) 1만5천원 이상 10만원 미만은 10만원, 점감구간(각 호 다목) 1만5천원 이상 3만원 미만은 3만원으로 결정"
  - law: "조세특례제한법"
    article: "부칙(법률 제20617호, 2024.12.31.) 제1조, 제17조"
    url: "https://www.law.go.kr/법령/조세특례제한법"
    note: "2025.1.1. 시행. 맞벌이 총소득기준금액 4,400만원과 제100조의5제1항제3호 개정규정은 시행 이후 근로장려금을 신청하는 경우부터 적용(2024년 귀속 정기신청분부터)"
  - law: "조세특례제한법 시행령"
    article: "제100조의3제1항"
    url: "https://www.law.go.kr/법령/조세특례제한법시행령/제100조의3"
    note: "연간 총소득 = 이자·배당·사업소득 x 업종별 조정률(가 20%~차 90%)·근로소득·연금소득·기타소득금액·종교인소득의 합계, 비과세 제외"
  - law: "조세특례제한법 시행령"
    article: "제100조의6제1항·제2항·제5항"
    url: "https://www.law.go.kr/법령/조세특례제한법시행령/제100조의6"
    note: "총급여액 등의 사업소득은 조정률을 곱한 금액. 부동산임대업 소득, 직계존비속 지급분, 미등록 사업자의 사업소득 등은 총급여액 등에서 제외. 근로장려금산정표는 별표 11"
  - law: "조세특례제한법 시행령"
    article: "별표 11 (근로장려금 산정표)"
    url: "https://www.law.go.kr/LSW/flDownload.do?gubun=&flSeq=170016365&bylClsCd=110201"
    note: "개정 2025.2.28. 대통령령 제35347호 부칙 제14조제2항: 2025.1.1. 이후 신청분부터 적용. 2026.9.18. 시행 시행령(대통령령 제36587호)에서도 같다"
  - law: "국세청 근로·자녀장려금 신청자격 안내"
    url: "https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=2452&cntntsId=7783"
    note: "총소득의 사업소득은 총수입금액 x 업종별 조정률, 종교인소득은 총수입금액. 재산 합계액 1.7억원 이상 2.4억원 미만은 산정액의 50%"
data:
  # 가구원 구성별 총소득기준금액과 산정 구간 (법 제100조의3제1항제2호, 제100조의5제1항)
  # phase_in_end 미만은 점증(가목), plateau_end 미만은 평탄(나목), 그 이상은 점감(다목)이다.
  household_types:
    single:
      total_income_limit: 22000000
      phase_in_end:       4000000
      plateau_end:        9000000
      max_amount:         1650000
    one_earner:
      total_income_limit: 32000000
      phase_in_end:       7000000
      plateau_end:        14000000
      max_amount:         2850000
    dual_earner:
      total_income_limit: 44000000
      phase_in_end:       8000000
      plateau_end:        17000000
      max_amount:         3300000
  # 맞벌이 판정: 부부 각각의 총급여액 등 하한 (법 제100조의3제5항제3호)
  dual_earner_min_each: 3000000
  # 재산 요건 (법 제100조의3제1항제4호, 제100조의5제4항)
  property_limit:               240000000
  property_reduction_threshold: 170000000
  property_reduction_rate:      "0.50"
  # 기한 후 신청 지급률 (법 제100조의7제2항)
  late_application_rate: "0.95"
  # 결정 시 최소 금액 규칙 (법 제100조의7제3항)
  minimum_award:
    none_below:      15000
    phase_in_floor:  100000
    phase_out_floor: 30000
  # 사업소득 업종별 조정률 (시행령 제100조의3제1항제4호 가목~차목)
  business_adjustment_rates:
    wholesale:                     "0.20"   # 가. 도매업
    agriculture_forestry_fishery:  "0.25"   # 나. 농업·임업 및 어업
    retail:                        "0.25"   # 나. 소매업
    mining:                        "0.30"   # 다. 광업
    auto_parts_sales:              "0.30"   # 다. 자동차 및 부품 판매업
    other:                         "0.30"   # 다. 그 밖에 다른 목에 해당되지 않는 사업
    manufacturing:                 "0.40"   # 라. 제조업
    food_service:                  "0.40"   # 라. 음식점업(주점업 제외)
    real_estate_sales:             "0.40"   # 라. 부동산매매업
    utilities:                     "0.45"   # 마. 전기·가스·증기 및 수도사업
    construction:                  "0.45"   # 마. 건설업(비주거용 건물 건설업 제외, 주거용 건물 개발 및 공급업 포함)
    bar:                           "0.55"   # 바. 주점업
    accommodation:                 "0.55"   # 바. 숙박업
    waste_environment:             "0.55"   # 바. 하수·폐기물처리·원료재생 및 환경복원업
    transportation:                "0.55"   # 바. 운수업
    publishing_broadcasting:       "0.55"   # 바. 출판·영상·방송통신업
    commodity_brokerage:           "0.60"   # 사. 상품중개업
    computer_information:          "0.60"   # 사. 컴퓨터 및 정보서비스업
    insurance_pension:             "0.60"   # 사. 보험 및 연금업
    finance_insurance_services:    "0.60"   # 사. 금융 및 보험관련 서비스업
    finance:                       "0.70"   # 아. 금융업
    arts_sports_leisure:           "0.70"   # 아. 예술·스포츠 및 여가 관련 서비스업
    repair_personal_services:      "0.70"   # 아. 수리 및 기타 개인 서비스업(인적용역 제외)
    real_estate_services:          "0.75"   # 자. 부동산 관련 서비스업
    professional_scientific:       "0.75"   # 자. 전문·과학 및 기술서비스업
    business_support:              "0.75"   # 자. 사업시설관리 및 사업지원서비스업
    education:                     "0.75"   # 자. 교육서비스업
    health_social_welfare:         "0.75"   # 자. 보건업 및 사회복지서비스업
    real_estate_rental:            "0.90"   # 차. 부동산임대업(소득세법 제45조제2항)
    rental_other:                  "0.90"   # 차. 임대업(부동산 제외)
    personal_services:             "0.90"   # 차. 인적용역
    household_employment:          "0.90"   # 차. 가구 내 고용활동
  # 총소득에는 넣고 총급여액 등에서는 빼는 업종 (시행령 제100조의6제2항제5호)
  earnings_excluded_industries:
    - real_estate_rental
  # 근로장려금 산정표 (시행령 별표 11). [이상, 미만, 단독, 홑벌이, 맞벌이], null 은 해당 없음 또는 "-"
  calculation_table:
