meta:
  domain: tax
  name:   kr_vehicle_tax
  year:   2026
effective_date: "2026-01-01"
status: enacted
notice_no: "지방세법 제127조·제128조·제150조·제151조 (법률 제21308호, 2026-01-01 시행) / 같은 법 시행령 제122조·제123조·제125조 (대통령령 제36736호, 2026-10-01 시행본)"
source_url: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=282559&efYd=20260701"
citations:
  - law: "지방세법"
    article: "제127조제1항제1호"
    url: "https://www.law.go.kr/법령/지방세법/제127조"
    note: "승용자동차 배기량 x 시시당 세액 = 연세액. 비영업용 1,000cc 이하 80원, 1,600cc 이하 140원, 1,600cc 초과 200원. 영업용 1,000cc 이하 18원, 1,600cc 이하 18원, 2,000cc 이하 19원, 2,500cc 이하 19원, 2,500cc 초과 24원"
  - law: "지방세법"
    article: "제127조제1항제2호"
    url: "https://www.law.go.kr/법령/지방세법/제127조"
    note: "비영업용 승용자동차 차령 3년 이상: 각 기분세액 = A/2 - (A/2 x 5/100)(n - 2), 2 <= n <= 12, 차령 12년 초과는 12년"
  - law: "지방세법"
    article: "제127조제1항제3호"
    url: "https://www.law.go.kr/법령/지방세법/제127조"
    note: "그 밖의 승용자동차(전기, 태양열, 알코올 이용, 시행령 제123조제2호) 연세액 영업용 20,000원, 비영업용 100,000원"
  - law: "지방세법"
    article: "제127조제3항"
    url: "https://www.law.go.kr/법령/지방세법/제127조"
    note: "조례로 표준세율의 100분의 50까지 초과하여 정할 수 있음. 이 정책은 표준세율만 담는다"
  - law: "지방세법"
    article: "제128조제1항·제3항"
    url: "https://www.law.go.kr/법령/지방세법/제128조"
    note: "제1기분(1~6월) 6월 16~30일, 제2기분(7~12월) 12월 16~31일 납기. 연세액 일시 신고납부 공제는 공제 대상 세액의 100분의 10 범위. 1월(1.16~1.31)과 3월(3.16~3.31): 연세액 x 납부기한 다음 날부터 12월 31일까지 일수/365(윤년 366) x 이자율. 6월(6.16~6.30): 제2기분 세액 x 이자율. 9월(9.16~9.30): 제2기분 세액 x 납부기한 다음 날부터 12월 31일까지 일수/184 x 이자율. 2025-12-31 개정, 부칙 제16조에 따라 2026-01-01 이후 납세의무 성립분부터 적용"
  - law: "지방세법"
    article: "제150조제7호·제151조제1항제7호"
    url: "https://www.law.go.kr/법령/지방세법/제151조"
    note: "지방교육세는 제127조제1항제1호·제3호의 비영업용 승용자동차 자동차세 납세의무자에게 납부할 자동차세액의 100분의 30"
  - law: "지방세법 시행령"
    article: "제122조"
    url: "https://www.law.go.kr/법령/지방세법시행령/제122조"
    note: "영업용과 비영업용 구분. 차령: 기산일이 1~6월이면 과세연도 - 기산일 연도 + 1, 7~12월이면 제1기분 과세연도 - 기산일 연도, 제2기분 과세연도 - 기산일 연도 + 1"
  - law: "자동차관리법 시행령"
    article: "제3조"
    url: "https://www.law.go.kr/법령/자동차관리법시행령/제3조"
    note: "차령기산일: 제작연도에 등록된 자동차는 최초 신규등록일, 제작연도에 등록되지 아니한 자동차는 제작연도의 말일"
  - law: "지방세법 시행령"
    article: "제125조제6항"
    url: "https://www.law.go.kr/법령/지방세법시행령/제125조"
    note: "법 제128조제3항·제4항 계산식의 대통령령으로 정하는 이자율은 100분의 5. 개정 2024-12-31, 2026-10-01 시행본에서도 같음"
  - law: "지방세기본법"
    article: "제59조"
    url: "https://www.law.go.kr/법령/지방세기본법/제59조"
    note: "지방자치단체 징수금의 끝수 계산은 국고금 관리법 제47조 준용: 10원 미만 끝수는 계산하지 아니함"
data:
  # 승용자동차 시시당 세액 (법 제127조제1항제1호). upper_cc 는 상한 포함, null 은 상한 없음
  passenger_cc_rates:
    non_business:
      - {upper_cc: 1000, per_cc: 80}
      - {upper_cc: 1600, per_cc: 140}
      - {upper_cc: null, per_cc: 200}
    business:
      - {upper_cc: 1000, per_cc: 18}
      - {upper_cc: 1600, per_cc: 18}
      - {upper_cc: 2000, per_cc: 19}
      - {upper_cc: 2500, per_cc: 19}
      - {upper_cc: null, per_cc: 24}
  # 그 밖의 승용자동차 연세액 (법 제127조제1항제3호)
  other_passenger_annual:
    non_business: 100000
    business:     20000
  # 비영업용 승용자동차 차령 경감 (법 제127조제1항제2호)
  age_reduction:
    min_age:       3       # 차령 3년 이상부터 적용
    base_age:      2       # 계산식의 (n - 2)
    max_age:       12      # 12년 초과는 12년으로 본다
    rate_per_year: "0.05"
  # 지방교육세 (법 제151조제1항제7호)
  local_education_tax_rate: "0.30"
  # 연세액 일시 신고납부 공제 (법 제128조제3항, 시행령 제125조제6항)
  annual_payment:
    interest_rate:     "0.05"
    max_ratio:         "0.10"
    second_half_days:  184
  # 끝수 처리 단위 (지방세기본법 제59조, 국고금 관리법 제47조)
  rounding_unit: 10
