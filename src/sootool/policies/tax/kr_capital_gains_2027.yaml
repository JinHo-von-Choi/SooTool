      holding_years_max: 4
      rate: 0.08
    - holding_years_min: 5
      holding_years_max: 5
      rate: 0.10
    - holding_years_min: 6
      holding_years_max: 6
      rate: 0.12
    - holding_years_min: 7
      holding_years_max: 7
      rate: 0.14
    - holding_years_min: 8
      holding_years_max: 8
      rate: 0.16
    - holding_years_min: 9
      holding_years_max: 9
      rate: 0.18
    - holding_years_min: 10
      holding_years_max: 10
      rate: 0.20
    - holding_years_min: 11
      holding_years_max: 11
      rate: 0.22
    - holding_years_min: 12
      holding_years_max: 12
      rate: 0.24
    - holding_years_min: 13
      holding_years_max: 13
      rate: 0.26
    - holding_years_min: 14
      holding_years_max: 14
      rate: 0.28
    - holding_years_min: 15
      holding_years_max: null
      rate: 0.30
  # 표 2 보유기간별 공제율 (1세대1주택)
  one_house_holding:
    - holding_years_min: 3
      holding_years_max: 3
      rate: 0.12
    - holding_years_min: 4
      holding_years_max: 4
      rate: 0.16
    - holding_years_min: 5
      holding_years_max: 5
      rate: 0.20
    - holding_years_min: 6
      holding_years_max: 6
      rate: 0.24
    - holding_years_min: 7
      holding_years_max: 7
      rate: 0.28
    - holding_years_min: 8
      holding_years_max: 8
      rate: 0.32
    - holding_years_min: 9
      holding_years_max: 9
      rate: 0.36
    - holding_years_min: 10
      holding_years_max: null
      rate: 0.40
  # 표 2 거주기간별 공제율 (1세대1주택). 연수 키는 거주연수. 2년 구간은 보유 3년 이상에 한정
  one_house_residence:
    - holding_years_min: 2
      holding_years_max: 2
      rate: 0.08
    - holding_years_min: 3
      holding_years_max: 3
      rate: 0.12
    - holding_years_min: 4
      holding_years_max: 4
      rate: 0.16
    - holding_years_min: 5
      holding_years_max: 5
      rate: 0.20
    - holding_years_min: 6
      holding_years_max: 6
      rate: 0.24
    - holding_years_min: 7
      holding_years_max: 7
      rate: 0.28
    - holding_years_min: 8
      holding_years_max: 8
      rate: 0.32
    - holding_years_min: 9
      holding_years_max: 9
      rate: 0.36
    - holding_years_min: 10
      holding_years_max: null
      rate: 0.40
  # 시행령 제159조의4: 표 2 적용 최소 거주연수. 미달이면 표 1
  one_house_min_residence_years: 2
  # 시행령 제154조제1항, 법 제89조제1항제3호
  one_house_exemption:
    sale_price_threshold: 1200000000
    min_holding_years: 2
    min_residence_years_if_acquired_in_regulated_area: 2
  # 법 제103조제1항
  basic_deduction: 2500000
  # 법 제104조제1항제2호·제3호
  short_term_rates:
    housing:
      under_1y: 0.70
      under_2y: 0.60
    presale_right:
      under_1y: 0.70
      under_2y: 0.60
    land_building:
      under_1y: 0.50
      under_2y: 0.40
  # 법 제104조제1항제1호 괄호, 제10호, 제8호
  presale_right_rate: 0.60
  unregistered_rate: 0.70
  non_business_land_surcharge: 0.10
  # 개정안 제103조 단서: 장기 거주 1세대 1주택 기본공제
  basic_deduction_long_residence_one_house:
    amount: 25000000
    min_residence_years: 10
    max_sale_price: 3000000000
  # 법 제104조제7항과 개정안 단서: 보유 2년 이상이면 2027년 양도분 중과 가산세율 완화
  multi_house_surcharge:
    two_houses: 0.20
    three_plus: 0.30
    relief:
      min_holding_years: 2
      two_houses: 0.05
      three_plus: 0.10
  income_tax_brackets:
    - upper: 14000000
      rate: 0.06
    - upper: 50000000
      rate: 0.15
    - upper: 88000000
      rate: 0.24
    - upper: 150000000
      rate: 0.35
    - upper: 300000000
      rate: 0.38
    - upper: 500000000
      rate: 0.40
    - upper: 1000000000
      rate: 0.42
    - upper: null
      rate: 0.45
