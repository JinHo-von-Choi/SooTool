  - law: "소득세법"
    article: "제89조·제95조·제103조제1항·제104조제1항"
    url: "https://www.law.go.kr/법령/소득세법/제104조"
    note: "개정안에 포함되지 않은 공제율·세율·비과세 기준은 현행 규정과 같다. 장기보유 특별공제 개편은 2028년부터"
data:
  # 장기보유 특별공제 표 1 (소득세법 제95조제2항): 보유연수별 공제율
