meta:
  domain: payroll
  name:   kr_labor_pay
  year:   2027
effective_date: "2027-01-01"
status: enacted
notice_no: "근로기준법 제11조·제18조제3항·제50조·제55조제1항·제56조 (법률 제21857호, 2026.8.4. 타법개정, 2026.10.2. 시행; 제56조 최종개정 2018.3.20.), 같은 법 시행령 제6조·제7조 별표 1·제9조 별표 2·제30조제1항 (대통령령 제35436호, 2025.4.8. 일부개정, 2025.10.23. 시행)"
source_url: "https://www.law.go.kr/법령/근로기준법/제56조"
citations:
  - law: "근로기준법"
    article: "제56조제1항(연장근로), 제2항(휴일근로), 제3항(야간근로)"
    url: "https://www.law.go.kr/법령/근로기준법/제56조"
    note: "연장근로 통상임금의 100분의 50 이상, 휴일근로 8시간 이내 100분의 50·8시간 초과 100분의 100, 야간근로(오후 10시부터 다음 날 오전 6시) 100분의 50 이상 가산. 개정 2018.3.20."
  - law: "근로기준법"
    article: "제11조제2항(상시 4명 이하 사업장의 적용 범위)"
    url: "https://www.law.go.kr/법령/근로기준법/제11조"
    note: "상시 4명 이하 사업장에는 대통령령으로 정하는 일부 규정만 적용한다."
  - law: "근로기준법 시행령"
    article: "제7조 별표 1(상시 4명 이하 사업장에 적용하는 법 규정)"
    url: "https://www.law.go.kr/법령/근로기준법시행령/제7조"
    note: "제4장 중 제54조, 제55조제1항, 제63조만 적용하므로 제50조, 제53조, 제56조(가산임금)는 적용하지 않고 제55조제1항(주휴)과 제18조는 적용한다. 별표 1 개정 2018.6.29."
  - law: "근로기준법 시행령"
    article: "제7조의2(상시 사용하는 근로자 수의 산정 방법)"
    url: "https://www.law.go.kr/법령/근로기준법시행령/제7조의2"
    note: "법 적용 사유 발생일 전 1개월 동안 사용한 근로자 연인원을 가동 일수로 나눈 수."
  - law: "근로기준법 시행령"
    article: "제6조제2항(통상임금의 시간급 산정)"
    url: "https://www.law.go.kr/법령/근로기준법시행령/제6조"
    note: "일급은 1일 소정근로시간 수, 주급은 1주의 통상임금 산정 기준시간 수(소정근로시간과 유급 처리 시간의 합), 월급은 1주의 기준시간 수에 1년 동안의 평균 주의 수를 곱해 12로 나눈 시간 수로 나눈다. 개정 2018.6.29."
  - law: "근로기준법"
    article: "부칙 및 조문별 시행일"
    url: "https://www.law.go.kr/법령/근로기준법"
    note: "2026.10.2. 시행판에서 2027년에 시행되는 개정 조문은 제43조의6, 제44조의4, 제60조, 제61조, 제116조이며 이 정책이 쓰는 제11조, 제18조, 제50조, 제55조, 제56조는 2027년에도 같은 내용으로 시행된다."
  - law: "2027년 적용 최저임금 고시(고용노동부고시 제2026-60호)"
    article: "1. 최저임금액"
    url: "https://www.law.go.kr/LSW//admRulInfoP.do?admRulSeq=2100000283564&chrClsCd=010201"
    note: "주 소정근로 40시간과 주당 유급주휴 8시간이면 월 환산 기준시간 수 209시간. (40+8)×365/7/12=208.57… 을 정수 시간으로 반올림한 값이다."
  - law: "근로기준법"
    article: "제18조제3항, 제55조제1항, 제50조"
    url: "https://www.law.go.kr/법령/근로기준법/제55조"
    note: "4주 평균 1주 소정근로시간 15시간 미만이면 주휴(제55조) 미적용. 1주 평균 1회 이상 유급휴일. 1일 근로시간 8시간, 1주 40시간."
  - law: "근로기준법 시행령"
    article: "제30조제1항, 제9조제1항 별표 2 제2호나목·제4호가목"
    url: "https://www.law.go.kr/법령/근로기준법시행령/제30조"
    note: "유급휴일은 1주 소정근로일을 개근한 자에게 준다. 단시간근로자의 1일 소정근로시간 수는 4주 동안의 소정근로시간을 그 기간 통상 근로자의 총 소정근로일 수로 나눈 시간 수."
  - law: "고용노동부 행정해석(임금근로시간과-1736, 2021.8.4.)"
    article: "주휴수당 발생 요건"
    url: "https://www.moel.go.kr/minwon/fastcounsel/fastcounselView.do?inetDcssMngId=202405091127105300604"
    note: "1주간 근로관계가 존속되고 그 기간의 소정근로일에 개근하면 8일째 근로가 예정되어 있지 않아도 주휴수당이 발생한다."
  - law: "기간제 및 단시간근로자 보호 등에 관한 법률"
    article: "제6조제3항, 제3조제1항"
    url: "https://www.law.go.kr/법령/기간제및단시간근로자보호등에관한법률/제6조"
    note: "상시 5인 이상 사업장의 단시간근로자가 소정근로시간을 초과해 근로하면 통상임금의 100분의 50 이상 가산. 연장근로와 같은 가산율로 처리한다."
# 근로기준법 제56조 가산율과 제55조 주휴 요건, 시행령 제6조 시간급 환산 규칙.
# 2026.10.2. 시행판 기준이며 해당 조문은 2018년 개정 이후 바뀌지 않았다.
data:
  premium_rates:
    overtime:                "0.5"   # 제56조제1항
    holiday_within_limit:    "0.5"   # 제56조제2항제1호
    holiday_over_limit:      "1.0"   # 제56조제2항제2호
    night:                   "0.5"   # 제56조제3항
  holiday_daily_limit_hours: 8       # 제56조제2항 각 호의 8시간 경계(휴일 하루 단위)
  night_window:
    start: "22:00"
    end:   "06:00"
  # 상시 근로자 수가 이 값 이하이면 제56조 가산 미적용 (법 제11조제2항, 시행령 별표 1)
  small_workplace_max_employees: 4
  weekly_holiday:
    min_weekly_contract_hours: 15    # 제18조제3항: 15시간 미만이면 미적용
    daily_hours_cap:           8     # 제50조제2항
  # 월 환산 기준시간 수 = (1주 소정근로시간 + 1주 유급 처리 시간) × days_per_year / days_per_week / months_per_year
  monthly_hours:
    days_per_year:   365
    days_per_week:   7
    months_per_year: 12
    round_decimals:  0               # 고시의 209시간과 같이 정수 시간으로 반올림
    rounding:        HALF_UP
  # 금액은 법정 최소액이므로 원 미만을 올린다
  amount_rounding:
    decimals: 0
    policy:   CEIL
