sha256: "4610544e79c6e990a890015af8b1d5dae2fbc67b1f5f2cb18deac1b12793456b"
effective_date: "2026-01-01"
status: enacted
notice_no: "소득세법 제48조·제55조제2항, 같은 법 시행령 제105조 (법률 제21221호, 2025.12.23. 일부개정; 해당 조문 최종개정 2022.12.31.)"
source_url: "https://www.law.go.kr/법령/소득세법/제48조"
citations:
  - law: "소득세법"
    article: "제48조제1항제1호(근속연수공제), 제1항제2호(환산급여공제), 제2항"
    url: "https://www.law.go.kr/법령/소득세법/제48조"
    note: "근속연수 1년 미만 절상, 근속연수공제는 퇴직소득금액 한도. 개정 2022.12.31., 2023.1.1. 시행, 2026.1.1. 현재 시행 중(법률 제21221호 판)."
  - law: "소득세법"
    article: "제55조제1항(기본세율), 제2항(퇴직소득 산출세액)"
    url: "https://www.law.go.kr/법령/소득세법/제55조"
    note: "기본세율 6~45% 8단계, 퇴직소득 산출세액 = 환산산출세액 / 12 × 근속연수. 개정 2022.12.31., 2023.1.1. 시행."
  - law: "소득세법 시행령"
    article: "제105조(근속연수)"
    url: "https://www.law.go.kr/법령/소득세법시행령/제105조"
    note: "근속연수 기산일, 퇴직급여 산정 제외기간 차감. 대통령령 제36737호(2026.9.30.) 판 기준 변경 없음."
# 퇴직소득세 계산 구조는 소득세법 제48조(퇴직소득공제)와 제55조(세율)에 따른다.
# 근속연수공제(5/10/20년 구간)와 환산급여공제(800만/7000만/1억/3억 구간)는
# 2023.1.1. 이후 퇴직분 기준이며, 기본세율은 kr_income_2026 과 같다.
data:
  # 근속연수공제 (소득세법 제48조제1항제1호)
  # 공제액 = base + marginal * (근속연수 - years_from)
  service_deduction_brackets:
    - years_from: 0
      years_to:   5
      base:       0
      marginal:   1000000       # 100만원/년
    - years_from: 5
      years_to:   10
      base:       5000000        # 5년까지 500만원
      marginal:   2000000        # 초과 200만원/년
    - years_from: 10
      years_to:   20
      base:       15000000       # 10년까지 1,500만원
      marginal:   2500000        # 초과 250만원/년
    - years_from: 20
      years_to:   null
      base:       40000000       # 20년까지 4,000만원
      marginal:   3000000        # 초과 300만원/년
  # 환산급여공제 (소득세법 제48조제1항제2호)
  # base + marginal * (환산급여 - lower)
  converted_salary_deduction_brackets:
    - lower:    0
      upper:    8000000
      base:     0
      marginal: "1.0"             # 전액 공제
    - lower:    8000000
      upper:    70000000
      base:     8000000
      marginal: "0.60"
    - lower:    70000000
      upper:    100000000
      base:     45200000
      marginal: "0.55"
    - lower:    100000000
      upper:    300000000
      base:     61700000
      marginal: "0.45"
    - lower:    300000000
      upper:    null
      base:     151700000
      marginal: "0.35"
  # 기본세율 (소득세법 제55조제1항), kr_income_2026 과 같다
  tax_brackets:
    - upper: 14000000
      rate:  0.06
    - upper: 50000000
      rate:  0.15
    - upper: 88000000
      rate:  0.24
    - upper: 150000000
      rate:  0.35
    - upper: 300000000
      rate:  0.38
    - upper: 500000000
      rate:  0.40
    - upper: 1000000000
      rate:  0.42
    - upper: null
      rate:  0.45
