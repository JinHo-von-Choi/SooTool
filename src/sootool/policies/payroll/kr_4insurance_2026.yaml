    note: "소득월액에서 천원 미만을 버림, 하한액보다 적으면 하한액·상한액보다 많으면 상한액. 적용기간 매년 7월~다음 해 6월"
  - law: "국민연금공단 공지(2026년도 국민연금 기준소득월액 상·하한액 조정 안내)"
