notice_no: "국민연금법 부칙(법률 제20903호) 제4조제1항; 국민건강보험법 시행령 제44조제1항(대통령령 제35931호); 노인장기요양보험법 시행령 제4조(대통령령 제35987호); 보건복지부고시 제2025-222호"
