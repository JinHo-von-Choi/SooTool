    note: "직장가입자 보수월액보험료 상한 9,183,480원, 하한 20,160원. 2026.1.1. 시행, 2026년 1월분 보험료부터"
  - law: "노인장기요양보험법"
    article: "제9조제1항"
    url: "https://www.law.go.kr/법령/노인장기요양보험법"
    note: "장기요양보험료 = 건강보험료 x (장기요양보험료율 / 건강보험료율)"
  - law: "노인장기요양보험법 시행령"
    article: "제4조, 부칙(대통령령 제35987호, 2025.12.30.) 제1조·제2조"
    url: "https://www.law.go.kr/법령/노인장기요양보험법시행령"
    note: "장기요양보험료율 100만분의 9,448. 2026.1.1. 시행"
  - law: "고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률"
    article: "제2조제3호, 제13조제2항·제5항"
    url: "https://www.law.go.kr/법령/고용보험및산업재해보상보험의보험료징수등에관한법률"
    note: "근로자 고용보험료는 실업급여 보험료율의 2분의 1. 산재보험료는 사업주 부담"
  - law: "고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률 시행령"
    article: "제12조제1항제2호"
    url: "https://www.law.go.kr/법령/고용보험및산업재해보상보험의보험료징수등에관한법률시행령"
    note: "실업급여 보험료율 1천분의 18"
  - law: "소득세법"
    article: "제12조제3호러목"
    url: "https://www.law.go.kr/법령/소득세법"
    note: "식사 기타 음식물을 제공받지 아니하는 근로자가 받는 월 20만원 이하의 식사대 비과세. 2026.1.1. 시행본"
  - law: "소득세법"
    article: "제134조제1항"
    url: "https://www.law.go.kr/법령/소득세법"
    note: "매월분 근로소득은 근로소득 간이세액표에 따라 원천징수"
  - law: "지방세법"
    article: "제92조제1항"
    url: "https://www.law.go.kr/법령/지방세법/제92조"
    note: "원천징수하는 소득세의 100분의 10을 개인지방소득세로 특별징수. 제103조의13은 2014년 지방세법 개편으로 삭제되고 제92조로 옮겨졌다. 2026.1.1. 시행본"
  - law: "국고금 관리법"
    article: "제47조제1항"
    url: "https://www.law.go.kr/법령/국고금관리법/제47조"
    note: "국고금의 수입·지출에서 10원 미만의 끝수는 계산하지 아니한다"
  - law: "지방세기본법"
    article: "제59조"
    url: "https://www.law.go.kr/법령/지방세기본법/제59조"
    note: "지방자치단체의 징수금 끝수 계산에 「국고금 관리법」 제47조를 준용한다"
data:
  # 2026년 1월~6월 4대보험 근로자 부담 기준
  national_pension:
    # 사업장가입자 기여금·사용자 부담금 각 4.75% (합계 9.5%)
    employee_rate: "0.0475"
    employer_rate: "0.0475"
    # 기준소득월액 하한·상한 (적용기간 2025.7.1.~2026.6.30.)
    base_min_monthly: 400000
    base_max_monthly: 6370000
    # 소득월액 천원 미만 버림 (시행령 제5조제1항)
    base_truncation_unit: 1000
  health_insurance:
    # 직장가입자 보험료율 7.19%, 근로자·사업주 각 3.595%
    employee_rate: "0.03595"
    employer_rate: "0.03595"
    # 장기요양보험료율 0.9448% / 건강보험료율 7.19%
    long_term_care_rate_of_health: "0.13140472878998609179"
    # 보수월액보험료(근로자·사업주 합계) 월 하한·상한
    premium_min_monthly_total: 20160
    # 보수월액보험료와 장기요양보험료는 원 단위에서 절사해 10원 단위로 부과한다
    # (4대사회보험 정보연계센터 모의계산: 건강보험료 7.19% x 50%, 장기요양보험료 건강보험료 x 0.9448%/7.19%, 원 단위 절사)
    premium_truncation_unit: 10
    premium_max_monthly_total: 9183480
  employment_insurance:
    # 근로자 부담: 실업급여 보험료율 1.8%의 2분의 1
    employee_rate: "0.009"
    # 사용자 부담 고용안정·직업능력개발 보험료는 사업장 규모별 상이: 계산에서 제외
  industrial_accident:
    # 산재보험료는 사업주 부담, 근로자 부담 없음
    employee_rate: "0.0"
  income_tax:
    # 월 원천징수 소득세는 근로소득 간이세액표(소득세법 시행령 별표 2) 조회
    reference_policy: "tax/kr_withholding_2026"
  local_income_tax:
    # 개인지방소득세 특별징수: 원천징수 소득세의 10%
    rate_of_income_tax: "0.1"
    # 징수 단계 끝수: 10원 미만 버림(「국고금 관리법」 제47조제1항 준용, 「지방세기본법」 제59조).
    # 국세청 근로소득 원천징수영수증 예시에서 소득세 9,450원 -> 지방소득세 940원(945원에서 10원 미만 버림).
    truncation_unit: 10
  non_taxable:
    # 비과세 식사대 월 한도 (소득세법 제12조제3호러목)
    meal_monthly_cap: 200000
