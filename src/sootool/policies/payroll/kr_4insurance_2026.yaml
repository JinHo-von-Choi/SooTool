    note: "사업장가입자 기여금·사용자 부담금 각각 기준소득월액의 1만분의 475(2026년). 2026.1.1. 시행"
  - law: "국민연금법"
    article: "제3조제1항제3호·제5호"
    url: "https://www.law.go.kr/법령/국민연금법"
    note: "소득은 비과세소득을 제외한 금액, 기준소득월액 정의"
  - law: "국민연금법 시행령"
