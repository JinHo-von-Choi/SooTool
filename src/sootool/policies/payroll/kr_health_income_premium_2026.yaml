sha256: "1911937e54f7206b05c3f1bee02aaaaa5429fef743ce00c6c8248d2b228eee5e"
effective_date: "2026-01-01"
effective_to: "2026-09-30"
status: enacted
notice_no: "국민건강보험법 제69조제4항·제71조제1항·제76조제2항; 국민건강보험법 시행령 제36조·제39조·제41조(대통령령 제35931호); 국민건강보험법 시행규칙 제44조; 보건복지부고시 제2025-222호"
source_url: "https://www.law.go.kr/법령/국민건강보험법시행령"
citations:
  - law: "국민건강보험법"
    article: "제69조제4항제2호, 제71조제1항, 제76조제2항"
    url: "https://www.law.go.kr/법령/국민건강보험법"
    note: "보수 외 소득월액 = (연간 보수 외 소득 - 대통령령 금액) x 1/12 를 보건복지부령에 따라 평가. 보수 외 소득월액보험료 = 보수 외 소득월액 x 보험료율, 직장가입자 전액 부담"
  - law: "국민건강보험법 시행령"
    article: "제41조제1항·제3항·제4항"
    url: "https://www.law.go.kr/법령/국민건강보험법시행령"
    note: "이자·배당·사업·근로·연금·기타소득(비과세 제외). 대통령령으로 정하는 금액은 연간 2천만원. 1월~10월분은 전전년도, 11월·12월분은 전년도 소득 자료(연금소득은 전년도)"
  - law: "국민건강보험법 시행규칙"
    article: "제44조제1항·제2항"
    url: "https://www.law.go.kr/법령/국민건강보험법시행규칙"
    note: "분리과세 이자·배당소득(소득세법 제14조제3항제6호)이 1천만원 이하이면 합산하지 않는다. 이자·배당·사업·기타소득은 전액, 근로·연금소득은 100분의 50으로 평가하고 소득 종류별 비율로 안분"
  - law: "국민건강보험법 시행령"
    article: "제34조제1항, 제36조제1항, 제39조제1항·제4항(2026.10.1. 개정 전)"
    url: "https://www.law.go.kr/법령/국민건강보험법시행령"
    note: "보수월액 = 전년도 보수총액 / 종사 개월수, 다시 산정한 보험료와의 차액을 반환 또는 추가징수. 직장가입자 부담 추가징수금액이 고지하는 달의 근로자 부담 보수월액보험료 이상이면 12회 이내 분할납부"
  - law: "월별 건강보험료액의 상한과 하한에 관한 고시(보건복지부고시 제2025-222호)"
    article: "제2조제2호"
    url: "https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=39"
    note: "직장가입자 소득월액 보험료 월 상한 4,591,740원. 2026년 1월분 보험료부터"
  - law: "노인장기요양보험법"
    article: "제9조제1항"
    url: "https://www.law.go.kr/법령/노인장기요양보험법"
    note: "장기요양보험료 = 건강보험료 x (장기요양보험료율 / 건강보험료율). 비율은 payroll/kr_4insurance 정책에서 읽는다"
# 보수 외 소득월액보험료와 보수월액보험료 정산 상수. 보험료율, 장기요양 비율, 보수월액보험료
# 상·하한은 payroll/kr_4insurance 정책을 쓴다.
data:
  # 보수 외 소득 공제 기준 연 2천만원 (시행령 제41조제4항)
  non_salary_income_threshold_annual: 20000000
  # 분리과세 이자·배당소득 합산 제외 기준 1천만원 이하 (시행규칙 제44조제1항 단서)
  financial_income_exclusion_max: 10000000
  # 소득 종류별 평가 비율 (시행규칙 제44조제2항)
  evaluation_rates:
    interest: "1"
    dividend: "1"
    business: "1"
    other:    "1"
    wage:     "0.5"
    pension:  "0.5"
  # 직장가입자 소득월액 보험료 월 상한 (고시 제2025-222호 제2조제2호)
  income_premium_max_monthly: 4591740
  # 보수월액보험료 정산 추가징수금액 분할납부 (시행령 제39조제4항)
  settlement_installment:
    max_installments: 12
    # monthly_premium: 고지하는 달의 근로자 부담 보수월액보험료 이상이면 분할 가능
    threshold_basis: "monthly_premium"
