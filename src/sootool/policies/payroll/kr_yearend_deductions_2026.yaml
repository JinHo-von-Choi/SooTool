meta:
  domain: payroll
  name:   kr_yearend_deductions
  year:   2026
effective_date: "2026-01-01"
status: enacted
notice_no: "소득세법 제52조제5항·제6항, 제59조의4제2항~제4항, 같은 법 시행령 제81조제4항·제118조의5~제118조의7, 조세특례제한법 제76조 (법률 제21221호 2025.12.23. 기준, 2026 귀속)"
source_url: "https://www.law.go.kr/법령/소득세법/제59조의4"
citations:
  - law: "소득세법"
    article: "제59조의4제2항"
    url: "https://www.law.go.kr/법령/소득세법/제59조의4"
    note: "의료비 15%(미숙아·선천성이상아 20%, 난임시술 30%), 총급여 3% 초과, 일반 700만원 한도, 3% 미달분 차감 순서 제1호→제2호→제3호→제4호. 개정 2023.12.31., 2026.1.1. 현재 시행 중(법률 제21221호 판)."
  - law: "소득세법 시행령"
    article: "제118조의5"
    url: "https://www.law.go.kr/법령/소득세법시행령/제118조의5"
    note: "의료비 범위, 실손보험금 제외, 안경 1명당 50만원, 산후조리원 출산 1회당 200만원, 난임시술 정의. 대통령령 제36737호(2026.9.30., 2026.10.1. 시행) 판."
  - law: "소득세법"
    article: "제59조의4제3항"
    url: "https://www.law.go.kr/법령/소득세법/제59조의4"
    note: "교육비 15%. 취학 전·초중고 1명당 연 300만원, 대학생 1명당 연 900만원, 본인·장애인 특수교육비 한도 없음. 개정 2025.12.23., 초등 저학년 예능학원·체육시설은 2026.1.1. 이후 지급분부터(법률 제21221호 부칙 제5조)."
  - law: "소득세법 시행령"
    article: "제118조의6"
    url: "https://www.law.go.kr/법령/소득세법시행령/제118조의6"
    note: "교육비 범위, 교복 1명당 50만원, 현장체험학습 30만원, 예능학원·체육시설(제8항~제10항, 2026.2.27. 신설)."
  - law: "소득세법"
    article: "제59조의4제4항"
    url: "https://www.law.go.kr/법령/소득세법/제59조의4"
    note: "특례기부금과 일반기부금을 합한 금액의 15%(1천만원 초과분 30%), 특례기부금 먼저 공제. 일반기부금 한도 소득금액 30%(종교단체 기부가 있으면 10% + min(20%, 종교단체 외 기부액)). 개정 2022.12.31., 2026.1.1. 현재 시행 중."
  - law: "소득세법 시행령"
    article: "제118조의7제1항, 제81조제4항"
    url: "https://www.law.go.kr/법령/소득세법시행령/제81조"
    note: "세액공제 한도 계산에 제81조제4항 준용. 정치자금·고향사랑·특례기부금 한도 = 소득금액 - 이월결손금, 일반기부금 한도 기준에서 이월결손금·정치자금·고향사랑·특례·우리사주조합기부금 순으로 차감. 대통령령 제36737호(2026.10.1. 시행) 판."
  - law: "조세특례제한법"
    article: "제76조제1항"
    url: "https://www.law.go.kr/법령/조세특례제한법/제76조"
    note: "정치자금 10만원까지 110분의 100, 10만원 초과 금액의 15%(3천만원 초과분 25%). 개정 2014.1.1., 법률 제21467호(2026.9.18. 시행) 판 기준 변경 없음."
  - law: "소득세법"
    article: "제52조제5항·제6항"
    url: "https://www.law.go.kr/법령/소득세법/제52조"
    note: "장기주택저당차입금 이자: 상환기간 15년 이상 기본 800만원, 고정금리+비거치식 2천만원, 고정금리 또는 비거치식 1천800만원, 10년 이상 고정금리 또는 비거치식 600만원. 기준시가 6억원 이하. 개정 2023.12.31., 2026.1.1. 현재 시행 중(법률 제21221호 판)."
data:
  # 의료비 세액공제
  medical:
    gross_income_floor_rate: "0.03"     # 총급여 3% 초과분만 공제 대상
    credit_rate:             "0.15"     # 일반 의료비 15%
    infertility_rate:        "0.30"     # 난임시술비 30%
    premature_rate:          "0.20"     # 미숙아·선천성이상아 20%
    general_limit:           7000000    # 일반 의료비 연 700만원 한도
    # 본인·6세 이하·65세 이상·장애인·중증질환자 등(제2호)은 한도 없음
    special_limit:           null

  # 교육비 세액공제
  education:
    credit_rate:             "0.15"
    limits:
      self:                  null          # 근로자 본인: 한도 없음
      preschool:             3000000       # 영유아(취학 전) 연 300만원
      elementary:            3000000       # 초·중·고 연 300만원
      middle_high:           3000000
      university:            9000000       # 대학(원 제외) 연 900만원
      disabled_special:      null          # 장애인 특수교육비: 한도 없음

  # 기부금 세액공제
  donation:
    # 특례기부금 + 일반기부금 합계에 적용 (소득세법 제59조의4제4항)
    rate_low:                "0.15"        # 1천만원 이하분
    rate_high:               "0.30"        # 1천만원 초과분
    threshold:               10000000      # 1천만원 분기선
    # 특례기부금 한도: (소득금액 - 이월결손금 - 정치자금 - 고향사랑) × 100% (시행령 제81조제4항제1호)
    legal_limit_rate:        "1.00"
    # 일반기부금 한도 (시행령 제81조제4항제3호, 기준 = 소득금액 - 기부금등합계액)
    designated_limit_rate:   "0.30"        # 종교단체 기부가 없는 경우
    designated_religious_base_rate:  "0.10"   # 종교단체 기부가 있는 경우 기준 × 10%
    designated_religious_extra_rate: "0.20"   # + min(기준 × 20%, 종교단체 외 기부액)
    # 정치자금 (조세특례제한법 제76조제1항)
    political_credit_rate:   "0.9090909091"   # 10만원 이하: 110분의 100
    political_small_cap:     100000        # 110분의 100 적용 상한
    political_rate_low:      "0.15"        # 10만원 초과 금액의 15%
    political_rate_high:     "0.25"        # 그 금액이 3천만원을 초과하는 분 25%
    political_threshold:     30000000      # 10만원 초과 금액 기준 분기선

  # 장기주택저당차입금 이자상환액 소득공제 (소득세법 제52조제5항·제6항)
  housing_loan_interest:
    # 상환기간별, 조건별 한도 (원)
    # key = "{term_years}_{condition}"
    limits:
      "15+_fixed_nongrace":  20000000      # 15년 이상, 고정금리 + 비거치식 (제6항제1호)
      "15+_fixed_or_ng":     18000000      # 15년 이상, 고정금리 또는 비거치식 (제6항제2호)
      "15+_other":           8000000       # 15년 이상, 기타 (제5항 단서)
      "10_15_fixed_or_ng":   6000000       # 10년 이상, 고정금리 또는 비거치식 (제6항제3호)
