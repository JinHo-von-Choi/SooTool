    note: "[2.4(A+0.75B)xP1/P + 1.8(A+B)xP2/P + 1.5(A+B)xP3/P + ... + 1.245(A+B)xP20/P + 1.29(A+B)xP21/P] x (1+0.05n/12). 2025.12월~2026.11월 지급사유 발생자(2026년 지급 개시) A값 3,193,511원"
# 노령연금 산정 상수. 연도별 금액(A값, 재평가율, 부양가족연금액)은 매년 고시로 바뀐다.
data:
  # 연금 수급 전 3년간 전체 가입자 평균소득월액의 평균액 (2026년 지급 개시분)
  a_value: 3193511
  # 가입기간 구간별 비례상수. 기본연금액 산식의 구간 항은 constant x (A + b_weight x B) x 구간 월수 / 전체 월수
  proportional_constants:
    - {from_year: 1988, to_year: 1998, constant: "2.4",   b_weight: "0.75"}
    - {from_year: 1999, to_year: 2007, constant: "1.8",   b_weight: "1"}
    - {from_year: 2008, to_year: 2008, constant: "1.500", b_weight: "1"}
    - {from_year: 2009, to_year: 2009, constant: "1.485", b_weight: "1"}
    - {from_year: 2010, to_year: 2010, constant: "1.470", b_weight: "1"}
    - {from_year: 2011, to_year: 2011, constant: "1.455", b_weight: "1"}
    - {from_year: 2012, to_year: 2012, constant: "1.440", b_weight: "1"}
    - {from_year: 2013, to_year: 2013, constant: "1.425", b_weight: "1"}
    - {from_year: 2014, to_year: 2014, constant: "1.410", b_weight: "1"}
    - {from_year: 2015, to_year: 2015, constant: "1.395", b_weight: "1"}
    - {from_year: 2016, to_year: 2016, constant: "1.380", b_weight: "1"}
    - {from_year: 2017, to_year: 2017, constant: "1.365", b_weight: "1"}
    - {from_year: 2018, to_year: 2018, constant: "1.350", b_weight: "1"}
    - {from_year: 2019, to_year: 2019, constant: "1.335", b_weight: "1"}
    - {from_year: 2020, to_year: 2020, constant: "1.320", b_weight: "1"}
    - {from_year: 2021, to_year: 2021, constant: "1.305", b_weight: "1"}
    - {from_year: 2022, to_year: 2022, constant: "1.290", b_weight: "1"}
    - {from_year: 2023, to_year: 2023, constant: "1.275", b_weight: "1"}
    - {from_year: 2024, to_year: 2024, constant: "1.260", b_weight: "1"}
    - {from_year: 2025, to_year: 2025, constant: "1.245", b_weight: "1"}
    - {from_year: 2026, to_year: null, constant: "1.29",  b_weight: "1"}
  # 노령연금 수급 최소 가입월수(10년, 법 제61조제1항)와 기본연금액 전액 지급 가입월수(20년, 법 제63조제1항)
  minimum_months: 120
  full_benefit_months: 240
  # 20년 초과 1년마다 기본연금액 가산 비율 (법 제51조제1항 단서)
  extension_rate_per_year: "0.05"
  # 월 지급액은 10원 미만 절사(국민연금공단 예상연금월액표의 금액 단위)
  monthly_truncation_unit: 10
  # 10년 이상 20년 미만: 기본연금액의 1천분의 500 + 10년 초과 1년마다 1천분의 50 (법 제63조제1항제2호)
  partial_base_ratio: "0.5"
  partial_increment_per_year: "0.05"
  # 조기노령연금: 5년 앞당기면 1천분의 700, 1개월마다 1천분의 5 (법 제63조제2항)
  early_reduction_per_month: "0.005"
  early_max_months: 60
  # 연기연금: 1개월마다 1천분의 6 가산, 최대 5년 (법 제62조제1항·제2항)
  deferral_increment_per_month: "0.006"
  deferral_max_months: 60
  # 일부 연기 가능 비율 (법 제62조제3항) 과 전부 연기
  deferral_ratios: ["0.5", "0.6", "0.7", "0.8", "0.9", "1"]
  # 부양가족연금액(연액), 2026년 1월분~12월분 (법 제52조, 고시 제2026-12호)
  dependent_annual:
    spouse:          306630
    child_or_parent: 204360
  # 2026년 지급 개시 급여에 적용하는 연도별 기준소득월액 재평가율 (고시 제2026-12호, 국민연금공단 공시)
