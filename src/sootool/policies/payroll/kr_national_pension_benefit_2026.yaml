    url: "https://www.law.go.kr/법령/국민연금법"
    note: "부양가족연금액, 가입기간 10년 이상 수급, 연기 1개월마다 1천분의 6 가산(전부 또는 1천분의 500~900 일부 연기), 10년 이상 20년 미만은 기본연금액의 1천분의 500에 10년 초과 1년마다 1천분의 50, 조기노령연금 55세 1천분의 700~59세 1천분의 940과 1개월마다 1천분의 5 가산"
