sha256: "82e48d6705c99fbbc0d003b71811a3fa0810680e06f0c863e12bbeda3ee9c167"
effective_date: "2026-01-01"
status: enacted
notice_no: "지방세법 제110조·제111조·제111조의2·제112조·제151조, 지방세법 시행령 제109조·제109조의2 (2026년 귀속)"
source_url: "https://www.law.go.kr/법령/지방세법/제111조"
citations:
  - law: "지방세법"
    article: "제110조제1항제2호·제3항"
    url: "https://www.law.go.kr/법령/지방세법/제110조"
    note: "주택 공정시장가액비율 범위 40~80%(1세대 1주택 30~70%), 과세표준상한액 = 직전 연도 과세표준 상당액 + 해당 연도 과세표준 × 과세표준상한율"
  - law: "지방세법 시행령"
    article: "제109조제1항제2호"
    url: "https://www.law.go.kr/법령/지방세법시행령/제109조"
    note: "주택 100분의 60. 2026년도 1세대 1주택은 시가표준액 3억 이하 43%, 3억 초과 6억 이하 44%, 6억 초과 45%(2026-05-29 개정)"
  - law: "지방세법 시행령"
    article: "제109조의2"
    url: "https://www.law.go.kr/법령/지방세법시행령/제109조의2"
    note: "직전 연도 과세표준 상당액 = 직전 연도 시가표준액 × 해당 연도 공정시장가액비율, 과세표준상한율 100분의 5"
  - law: "지방세법"
    article: "제111조제1항제3호나목"
    url: "https://www.law.go.kr/법령/지방세법/제111조"
    note: "주택 표준세율 0.1%, 0.15%, 0.25%, 0.4% 누진"
  - law: "지방세법"
    article: "제111조의2"
    url: "https://www.law.go.kr/법령/지방세법/제111조의2"
    note: "시가표준액 9억 이하 1세대 1주택 0.05%, 0.1%, 0.2%, 0.35%. 법률 제17769호 부칙에 따라 2026-12-28까지 성립한 납세의무에 한정"
  - law: "지방세법"
    article: "제112조"
    url: "https://www.law.go.kr/법령/지방세법/제112조"
    note: "도시지역분 과세표준의 1천분의 1.4(조례로 1천분의 2.3 이내 조정), 의회 의결 후 고시된 지역"
  - law: "지방세법"
    article: "제151조제1항제6호"
    url: "https://www.law.go.kr/법령/지방세법/제151조"
    note: "지방교육세 = 재산세액(도시지역분 제외)의 100분의 20"
data:
  # 주택 공정시장가액비율 (지방세법 시행령 제109조제1항제2호 본문)
  fair_market_ratio: "0.60"
  # 2026년도 1세대 1주택 공정시장가액비율 (같은 호 단서, 시가표준액 구간 상한 포함)
  one_house_fair_market_ratio:
    - upper: 300000000
      ratio: "0.43"
    - upper: 600000000
      ratio: "0.44"
    - upper: null
      ratio: "0.45"
  # 주택 표준세율 (지방세법 제111조제1항제3호나목, 과세표준 기준)
  brackets:
    - upper: 60000000
      rate: 0.001
    - upper: 150000000
      rate: 0.0015
    - upper: 300000000
      rate: 0.0025
    - upper: null
      rate: 0.004
  # 1세대 1주택 특례세율 (지방세법 제111조의2, 시가표준액 9억 이하)
  one_house_special:
    max_published_price: 900000000
    brackets:
      - upper: 60000000
        rate: 0.0005
      - upper: 150000000
        rate: 0.001
      - upper: 300000000
        rate: 0.002
      - upper: null
        rate: 0.0035
  # 과세표준상한율 (지방세법 시행령 제109조의2제2항)
  tax_base_cap_rate: "0.05"
  surcharges:
    local_edu_rate: "0.20"       # 지방교육세: 재산세액의 20%
    urban_area_rate: "0.0014"    # 도시지역분: 과세표준의 0.14%
