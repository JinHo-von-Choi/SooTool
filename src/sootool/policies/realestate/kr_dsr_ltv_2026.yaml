notice_no: "은행업감독규정 <별표6>(2026-10-02 시행본), 금융위원회 행정지도(2025.6.27·9.7·10.15 대책, 2025.12 및 2026 스트레스 DSR 운용)"
source_url: "https://www.fsc.go.kr/no010101/85432"
# LTV 규제지역 40%, 수도권·규제지역 다주택 추가구입 금지, 생애최초 70%, 가격별 주담대 한도는
# 행정지도로 시행 중이며 은행업감독규정 <별표6> 본문(규제지역 50%, 추가구입 60/30%)에는
# 반영되지 않았다. 은행 창구에서 적용하는 행정지도 수치를 쓴다.
citations:
