      tax_after_filing_credit: "9700000"
    source:
      <<: *guide2
      quote: "1천만 원의 상속세를 내야하는 상속인이 ... 정상신고 시 납부할 세금: ①－② = 9,700,000원 ① 납부세액: 10,000,000원 ② 신고세액공제: (10,000,000원×3%) = 300,000원"
    note: 상속세 산출세액이 1,000만원이 되도록 배우자 없이 과세가액 6억원(일괄공제 5억원 후 과세표준 1억원)으로 둔다.

