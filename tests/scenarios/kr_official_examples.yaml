      base_year: 2026
      quote: "B값 1,000,000 / 연금보험료 95,000 / 10년 225,400 / 20년 450,800 / 40년 901,600 (2026년 1월 최초 가입 가정, 2026년 적용 A값 3,193,511원)"
    note: 표는 2026년 1월 최초 가입을 가정하므로 가입기간을 2026년부터 시작하도록 contribution_end_year 를 둔다. 부양가족연금 제외.

