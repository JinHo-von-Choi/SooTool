    expected:
      computed_tax: "10000000"
      tax: "13000000"
    source: &guide2
      title: 국세청 2026 세금절약 가이드 II(양도소득세·상속세·증여세), 증여세 알뜰정보 14
      url: https://www.nts.go.kr/comm/nttFileDownload.do?fileKey=a8e05f0656503a89e08a343f4229f6b5
      base_year: 2026
      quote: "일반적으로 계산한 증여세액이 1,000만 원이라고 할 경우 세대를 건너 뛰어 증여하면 1,300만 원의 증여세를 내야 한다."
    note: 일반 산출세액이 1,000만원이 되도록 성년 손자녀가 조부모에게서 1억5천만원(증여재산공제 5천만원 후 과세표준 1억원)을 받는 경우로 둔다.

  - id: gift_timely_filing_credit
    area: 증여세
    tool: tax.kr_gift
    inputs: {gift_amount: "150000000", relationship: lineal_ascendant, year: 2026}
    expected:
      tax: "10000000"
      filing_credit: "300000"
      tax_after_filing_credit: "9700000"
    source:
      <<: *guide2
      quote: "정상신고 시 납부할 세금: ① - ② = 9,700,000원 ① 납부세액: 10,000,000원 ② 신고세액공제: (10,000,000원×3%) = 300,000원"
    note: 증여세 산출세액이 1,000만원이 되도록 성년 자녀가 부모에게서 1억5천만원을 받는 경우로 둔다.

  # ---------------------------------------------------------------- 상속세
  - id: inheritance_timely_filing_credit
