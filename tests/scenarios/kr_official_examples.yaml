    inputs: {gross_estate: "2500000000", spouse_inheritance: "0", year: 2026, has_spouse: false, children_count: 2}
    expected:
      taxable_base: "2000000000"
      tax: "640000000"
    source:
      <<: *guide2
      quote: "사망하기 전 12년 전에 자녀에게 5억 원을 증여하고 사망했다면 상속세 과세표준은 20억 원(상속재산 25억 원－일괄공제 5억 원)이 되고 이에 대한 상속세의 산출세액은 6억 4천만 원"

  - id: inheritance_pregift_within_10y
    area: 상속세
    tool: tax.kr_inheritance
    inputs: {gross_estate: "3000000000", spouse_inheritance: "0", year: 2026, has_spouse: false, children_count: 2}
    expected:
      taxable_base: "2500000000"
      tax: "840000000"
    source:
      <<: *guide2
      quote: "사망하기 8년 전(10년 이내)에 자녀에게 5억 원을 증여하고 사망했다면 상속세 과세표준은 25억 원(상속재산 25억 원+상속개시 전 10년 이내에 증여한 재산 5억 원－일괄공제 5억 원)이 되며 이에 대한 상속세의 산출세액은 8억 4천만 원"
    note: 과세가액은 상속재산 25억원에 10년 이내 증여재산 5억원을 더한 30억원이다.

  - id: inheritance_spouse_nothing
    area: 상속세
    tool: tax.kr_inheritance
    inputs: {gross_estate: "3500000000", spouse_inheritance: "0", year: 2026, has_spouse: true, children_count: 2}
    expected:
      taxable_base: "2500000000"
      tax: "840000000"
    source:
      <<: *guide2
      quote: "35억 원에서 일괄공제 5억 원, 배우자공제 5억 원을 차감하면 상속세 과세표준이 25억 원이 되며, 이에 대한 상속세는 8억 4천만 원이 나온다."

  - id: inheritance_spouse_legal_share
    area: 상속세
    tool: tax.kr_inheritance
    inputs: {gross_estate: "3500000000", spouse_inheritance: "1500000000", year: 2026, has_spouse: true, children_count: 2, spouse_legal_share_cap: "1500000000"}
    expected:
      taxable_base: "1500000000"
      tax: "440000000"
    source:
      <<: *guide2
      quote: "35억 원에서 일괄공제 5억 원, 배우자공제 15억 원을 차감하면 상속세 과세표준은 15억 원이 되며, 이에 대한 상속세는 4억 4천만 원이 된다."
    note: 법정상속지분(모 3/7)대로 배우자가 15억원을 상속받는 경우. 배우자공제 한도도 15억원이다.

