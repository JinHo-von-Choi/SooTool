# 한국 세무·노무 공식 계산 예시 시나리오 세트
#
# 각 시나리오의 expected 는 출처(국세청, 국가법령정보센터, 행정안전부·서울시, 고용노동부,
# 국민연금공단, 재정경제부 등)에 적힌 계산 결과 숫자 그대로다. 도구 출력에서 옮겨 적은 값은 없다.
# source.base_year 는 출처가 전제한 연도이며 inputs.year 와 같아야 한다. 연도 표기가 없는 현행
# 안내(2026년판 책자, 현행 안내 페이지)는 2026 으로 둔다.
# 현행과 다른 가정이거나 해당 연도 정책이 없는 예시, 대응 도구가 없는 예시는 excluded 에 사유와 함께 둔다.
#
# 작성자: 최진호
# 작성일: 2026-10-04

meta:
  title: 한국 세무 실무 재현율 시나리오 세트
  collected_on: "2026-10-04"

scenarios:
  # ---------------------------------------------------------------- 최저임금
  - id: minwage_2026_notice
    area: 최저임금
    tool: payroll.kr_minimum_wage_check
    inputs: {wage_amount: "2156880", year: 2026}
    expected:
      statutory_hourly_minimum: "10320"
      notice_monthly_amount: "2156880"
    source:
      title: 2026년 적용 최저임금 고시(고용노동부고시 제2025-47호)
      url: https://www.moel.go.kr/info/lawinfo/instruction/view.do?bbs_seq=20250800121
      base_year: 2026
      quote: "모든 산업 10,320원 / 월 환산액 2,156,880원: 주 소정근로 40시간을 근무할 경우, 월 환산 기준시간 수 209시간"

  - id: minwage_2027_notice
    area: 최저임금
    tool: payroll.kr_minimum_wage_check
    inputs: {wage_amount: "2236300", year: 2027}
    expected:
      statutory_hourly_minimum: "10700"
      notice_monthly_amount: "2236300"
    source:
      title: 2027년도 적용 최저임금 시간급 10,700원(고용노동부 보도자료 2026.8.5.)
      url: https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=19744
      base_year: 2027
      quote: "월 환산액은 2,236,300원(1주 소정근로 40시간, 월 209시간 기준)"

  # ---------------------------------------------------------------- 연장·야간·휴일근로수당
  - id: labor_overtime_16h
    area: 근로기준법 수당
    tool: payroll.kr_overtime_pay
    inputs: {ordinary_wage: "12000", year: 2026, employee_count: 10, overtime_hours: "16"}
    expected:
      total_pay: "288000"
    source:
      title: 고용노동부 임금명세서 작성 안내(연장·야간·휴일근로수당 계산 방법)
      url: https://www.moel.go.kr/wageCal.do
      base_year: 2026
      quote: "연장근로수당 288,000원 = 16시간 X 12,000원 X 1.5"
    note: 연도 표기 없는 현행 안내. 상시 5인 이상 사업장 전제라 상시 근로자 수를 10명으로 둔다.

  - id: labor_overtime_night_4h
    area: 근로기준법 수당
    tool: payroll.kr_overtime_pay
    inputs: {ordinary_wage: "12000", year: 2026, employee_count: 10, overtime_hours: "4", night_hours: "4"}
    expected:
      total_pay: "96000"
    source:
      title: 고용노동부 임금명세서 작성 안내(연장·야간·휴일근로수당 계산 방법)
      url: https://www.moel.go.kr/wageCal.do
      base_year: 2026
      quote: "연장근로수당 96,000원 = 4시간 X 12,000원 X 2.0 / 연장근로수당 72,000원 = 4시간 X 12,000원 X 1.5, 야간근로수당 24,000원 = 4시간 X 12,000원 X 0.5"
    note: 연장근로 4시간이 모두 야간(22시~06시)에 이루어진 경우.

  - id: labor_holiday_8h
    area: 근로기준법 수당
    tool: payroll.kr_overtime_pay
    inputs: {ordinary_wage: "12000", year: 2026, employee_count: 10, holiday_hours_by_day: ["8"]}
    expected:
      total_pay: "144000"
    source:
      title: 고용노동부 임금명세서 작성 안내(연장·야간·휴일근로수당 계산 방법)
      url: https://www.moel.go.kr/wageCal.do
      base_year: 2026
      quote: "휴일근로수당 144,000원 = 8시간 X 12,000원 X 1.5"

  - id: labor_holiday_10h
    area: 근로기준법 수당
    tool: payroll.kr_overtime_pay
    inputs: {ordinary_wage: "12000", year: 2026, employee_count: 10, holiday_hours_by_day: ["10"]}
    expected:
      total_pay: "192000"
    source:
      title: 고용노동부 임금명세서 작성 안내(연장·야간·휴일근로수당 계산 방법)
      url: https://www.moel.go.kr/wageCal.do
      base_year: 2026
      quote: "휴일근로수당 192,000원 = (8시간 X 12,000원 X 1.5) + (2시간 X 12,000원 X 2.0)"

  # ---------------------------------------------------------------- 4대보험
  - id: insurance_health_ltc_2m
    area: 4대보험
    tool: payroll.kr_salary
    inputs: {monthly_salary: "2000000", year: 2026}
    expected:
      insurances.health_insurance: "71900"
      insurances.long_term_care: "9440"
    source:
      title: 4대사회보험 정보연계센터 4대사회보험료 모의계산(건강보험 직장가입자 본인 부담분 계산식)
      url: https://www.4insure.or.kr/pbiz/ntcn/inscSmlCalcView.do
      base_year: 2026
      quote: "보수월액이 2,000,000 원인 경우 - 건강보험료 : 2,000,000 ⅹ 7.19% ⅹ 50% = 71,900 원 - 장기요양보험료 : 71,900 ⅹ ((0.9448%)/(7.19%)) = 9,440 원"
    note: 출처는 두 보험료 모두 끝수를 절사(원 단위 절사로 표기)해 10원 단위로 적는다.

